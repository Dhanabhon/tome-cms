services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tomecms
      POSTGRES_USER: tomecms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomecms -d tomecms"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-08-07T18-34-35Z
    command: server /data --console-address :9001 --license /minio.license
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["minio-data:/data"]
    configs:
      - source: minio-license
        target: /minio.license
    ports: ["127.0.0.1:${MINIO_PORT:-9000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
  minio-init:
    image: quay.io/minio/aistor/mc:RELEASE.2026-03-12T04-18-55Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        printf '%s\n' '<CORSConfiguration>' '<CORSRule>' "<AllowedOrigin>$${TOME_CMS_PUBLIC_URL%/}</AllowedOrigin>" '<AllowedMethod>PUT</AllowedMethod>' '<AllowedMethod>HEAD</AllowedMethod>' '<AllowedMethod>GET</AllowedMethod>' '<AllowedHeader>content-type</AllowedHeader>' '<AllowedHeader>x-amz-checksum-sha256</AllowedHeader>' '<ExposeHeader>ETag</ExposeHeader>' '<ExposeHeader>x-amz-checksum-sha256</ExposeHeader>' '<MaxAgeSeconds>3600</MaxAgeSeconds>' '</CORSRule>' '</CORSConfiguration>' > /tmp/tomecms-cors.xml
        mc cors set "local/$$S3_BUCKET" /tmp/tomecms-cors.xml
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      TOME_CMS_PUBLIC_URL: ${TOME_CMS_PUBLIC_URL}
  app:
    profiles: ["production"]
    build:
      context: .
    env_file:
      - path: .env.local
        required: false # Allows config/build before bootstrap creates this file.
    environment:
      DATABASE_URL: postgresql://tomecms:${POSTGRES_PASSWORD}@postgres:5432/tomecms
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped
    ports: ["127.0.0.1:${APP_PORT:-4321}:4321"]
volumes:
  postgres-data:
  minio-data:
configs:
  minio-license:
    file: ${MINIO_LICENSE_FILE:?Set MINIO_LICENSE_FILE to an external AIStor license}
