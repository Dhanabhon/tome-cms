name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    # Pinned rather than ubuntu-latest, which becomes Ubuntu 26 from 19 October 2026. The
    # browser tests install Chromium's system libraries with --with-deps, which knows a
    # fixed list of distributions, and a new one can arrive before the Playwright that
    # supports it. Move this forward on purpose, in a commit that can fail on its own.
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/dhanabhon/tome-cms
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The same Node the CI run that approved this commit used, and the image runs: without
      # this the release built with whatever Node the runner image carried that day.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p 'require(\"./package.json\").version')"
          test "$VERSION" = "$PACKAGE_VERSION"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Fetch the DB-IP Lite country database
        # CC BY 4.0: the Stats screen and the README carry DB-IP's attribution. The month's file
        # appears some days into the month, so the previous month's stands in until then. DB-IP
        # publishes no checksum for the Lite file, so the lookup below -- getting a real country
        # back out of the file we just downloaded -- is the check that it is whole.
        run: |
          mkdir -p data/geoip
          for month in "$(date -u +%Y-%m)" "$(date -u -d '-1 month' +%Y-%m)"; do
            if curl -fsSL --retry 3 "https://download.db-ip.com/free/dbip-country-lite-${month}.mmdb.gz" -o dbip.mmdb.gz; then
              gunzip -c dbip.mmdb.gz > data/geoip/dbip-country-lite.mmdb
              rm dbip.mmdb.gz
              break
            fi
          done
          test -s data/geoip/dbip-country-lite.mmdb
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { Reader } from 'mmdb-lib';
            const code = new Reader(readFileSync('data/geoip/dbip-country-lite.mmdb')).get('8.8.8.8')?.country?.iso_code ?? '';
            if (!/^[A-Z]{2}$/.test(code)) { console.error('The GeoIP file does not answer.'); process.exit(1); }
          "

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 (node24)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (node24)

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (node24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable multi-architecture image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (node24)
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            TOME_CMS_VERSION=${{ steps.release.outputs.version }}
            TOME_CMS_COMMIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push=true,push-by-digest=true,name-canonical=true

      - name: Capture immutable image digest
        id: image-digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
          printf 'value=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest OCI image
        id: image-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image-digest.outputs.value }}
          push-to-registry: true

      - name: Copy OCI attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.image-attestation.outputs.bundle-path }}
        run: |
          set -eu
          test -n "$BUNDLE_PATH"
          test -f "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" tomecms-image.attestation.json

      - name: Generate release manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ steps.image-digest.outputs.value }}
        run: |
          # The newest migration this release's schema ends at, read from the migrations themselves.
          TARGET_MIGRATION="$(ls src/server/db/migrations | sed -n 's/^\([0-9]\{3\}_[a-z0-9_]*\)\.ts$/\1/p' | sort | tail -n 1)"
          test -n "$TARGET_MIGRATION"
          npm run release:manifest -- \
            --package-version "$VERSION" \
            --tag "v$VERSION" \
            --commit "$COMMIT" \
            --digest "$DIGEST" \
            --released-at "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            --minimum-direct-upgrade-from 1.0.0 \
            --minimum-updater-version 1.0.0 \
            --target-migration "$TARGET_MIGRATION" \
            --rollback-safe-from 1.0.0 \
            --output update-manifest.json

      - name: Attest release manifest
        id: manifest-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: update-manifest.json

      - name: Copy manifest attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.manifest-attestation.outputs.bundle-path }}
        run: |
          set -eu
          test -n "$BUNDLE_PATH"
          test -f "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" update-manifest.attestation.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The version's own notes, not a list of every commit since the first.
        run: gh release create "$TAG" update-manifest.json tomecms-image.attestation.json update-manifest.attestation.json --notes-file "docs/releases/${TAG#v}.md" --title "TomeCMS ${TAG#v}"
