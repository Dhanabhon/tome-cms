name: Docs

# Builds and checks the documentation site. A push to main builds, checks and deploys it to
# GitHub Pages; a pull request only builds and checks.
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'src/server/http/**'
      - 'src/server/stats/rules.ts'
      - 'src/lib/slug.ts'
      - 'src/lib/editor-content.ts'
      - 'src/server/content/mutations.ts'
      - 'src/styles/installer-tokens.css'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'src/server/http/**'
      - 'src/server/stats/rules.ts'
      - 'src/lib/slug.ts'
      - 'src/lib/editor-content.ts'
      - 'src/server/content/mutations.ts'
      - 'src/styles/installer-tokens.css'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install the app's dependencies
        run: npm ci

      - name: Install the site's dependencies
        run: npm ci --prefix website

      - name: Generate the API reference's source
        run: npm run docs:openapi

      - name: Check
        run: npm run check --prefix website

      - name: Build
        run: npm run build --prefix website

      - name: Set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
