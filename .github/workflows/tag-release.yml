name: Tag a new version

# Work happens on develop. A merge into main that carries a version not tagged yet releases
# itself: once CI has passed on that commit, this tags it vX.Y.Z and starts release.yml on the
# tag. A merge that keeps the version releases nothing.
#
# CI does not run on main. A merge into main is a fast-forward, so the commit that arrives here
# is one CI has already run on, or is running on, from its push to develop. This waits for that
# run instead of testing the same tree twice. A commit CI never saw pushed, such as a merge
# commit or a fix pushed straight to main, is not released.
#
# The release has to run on the tag, not on main: the installer and the updater accept only
# attestations made from refs/tags/vX.Y.Z. A tag pushed with this workflow's token starts no
# workflow by itself, so release.yml is started by a dispatch on the tag, the one event that
# token may start.
on:
  push:
    branches: [main]

# One at a time, and none cut off: two merges in a row each get their answer.
concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    # CI takes about half an hour; this leaves room for a run that started just before.
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout the commit pushed to main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # A push to develop and main together can reach here before GitHub has created
          # the CI run for develop, so a missing run is waited for a few minutes first.
          started=$SECONDS
          while :; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=20" \
              -q '.workflow_runs[] | "\(.status) \(.conclusion)"')"
            if [[ "$runs" == *"completed success"* ]]; then
              echo "CI passed on $SHA."
              exit 0
            fi
            if [[ -z "$runs" ]]; then
              if (( SECONDS - started > 300 )); then
                echo "::error::CI has not run on $SHA. Push it to develop, let CI pass there, then re-run this job." >&2
                exit 1
              fi
            elif ! grep -qv '^completed ' <<<"$runs"; then
              echo "::error::CI did not pass on $SHA. Once a re-run of it passes, re-run this job." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Tag it and release it when its version is new
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The package version must be MAJOR.MINOR.PATCH, not $VERSION." >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already tagged, so this merge releases nothing."
            exit 0
          fi
          if ! test -f "docs/releases/$VERSION.md"; then
            echo "docs/releases/$VERSION.md is missing: the release carries it as its notes." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          gh workflow run release.yml --ref "$TAG"
          echo "Tagged $SHA as $TAG and started the release."
