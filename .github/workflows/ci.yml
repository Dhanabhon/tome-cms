name: CI

# Until now the only workflow triggered on release tags, so check, test:unit and
# build ran once per release and the integration suite ran nowhere. That is how it
# came to fail 11 of 22 on a clean checkout without anyone noticing.
#
# Not on main: a merge into main is a fast-forward of a commit this already ran on from
# develop, and tag-release.yml waits for that run rather than testing the same tree twice.
on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned rather than ubuntu-latest, which becomes Ubuntu 26 from 19 October 2026. The
    # browser tests install Chromium's system libraries with --with-deps, which knows a
    # fixed list of distributions, and a new one can arrive before the Playwright that
    # supports it. Move this forward on purpose, in a commit that can fail on its own.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      # The runner is a real Ubuntu 24.04 with systemd, which a container is not, so
      # the dry run passes every check here and prints what it would install.
      - name: Check the server preparation script
        run: |
          shellcheck scripts/prepare-vps.sh
          sudo scripts/prepare-vps.sh --dry-run --cms-url https://cms.example.com --media-url https://media.example.com

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Brings up its own disposable Postgres and SeaweedFS through
      # compose.test.yaml, and tears them down again afterwards.
      - name: Run integration tests
        run: npm run test:integration

      # The managed updater against real containers, with Go and Docker from the runner
      # image. It ran only by hand before 1.0.0, and only on arm64.
      - name: Run the managed update harness
        run: npm run test:operations:update

      # The installer and the updater list an image's migrations in a locked-down container.
      # That step failed on every server in 1.0.0, because nothing ran it against a real image.
      - name: Build the application image and list its migrations
        run: |
          docker build -t tomecms-ci .
          npm run check:inventory -- tomecms-ci

      # The browser gate ran nowhere until 2026-09-20, which is how a sign-in that could
      # never succeed passed check, test:unit, build and the integration suite on its way
      # out. passkey-sign-in brings up its own disposable Postgres and SeaweedFS the same
      # way the integration suite does.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      # A browser test that fails only here leaves its trace, so it can be read instead of
      # guessed at: open it with `npx playwright show-trace`.
      - name: Keep the failed browser tests' traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
