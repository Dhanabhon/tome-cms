name: CI

# Until now the only workflow triggered on release tags, so check, test:unit and
# build ran once per release and the integration suite ran nowhere. That is how it
# came to fail 11 of 22 on a clean checkout without anyone noticing.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Brings up its own disposable Postgres and SeaweedFS through
      # compose.test.yaml, and tears them down again afterwards.
      - name: Run integration tests
        run: npm run test:integration
