name: tomecms-foundation-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tomecms_test
      POSTGRES_USER: tomecms_test
      POSTGRES_PASSWORD: foundation-test-only
      PGPASSWORD: foundation-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomecms_test -d tomecms_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["127.0.0.1:55432:5432"]
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -bucket=tomecms-test-media
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.allowedOrigins=${TOME_CMS_TEST_ORIGIN:-http://localhost:4321}
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: tomecms_test
      AWS_SECRET_ACCESS_KEY: foundation-test-only
    healthcheck:
      test: ["CMD", "curl", "-sS", "--max-time", "2", "-o", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs: ["/data"]
    configs:
      - source: seaweedfs-s3-config
        target: /etc/seaweedfs/s3.json
    ports: ["127.0.0.1:59000:8333"]
configs:
  seaweedfs-s3-config:
    file: ./config/seaweedfs-s3.json
